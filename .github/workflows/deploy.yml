# Builds the app and deploys it to GitHub Pages.
# Pull requests are only built (a type check plus a production build); pushes to main are also deployed.
# One-time setup: in the repo's Settings → Pages, set "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but never cancels a running deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gives the path the site is served from, e.g. "/SnoozieWorld" for https://<user>.github.io/SnoozieWorld/,
      # or "" on a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      # The app reads import.meta.env.BASE_URL for its assets, so building with the Pages path is all it needs.
      - run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
